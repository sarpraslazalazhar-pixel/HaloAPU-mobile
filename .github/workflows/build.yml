name: Build Flutter Apps (Android & iOS)

'on':
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Lint and static analysis
        run: flutter analyze

      - name: Run unit tests
        run: flutter test

      - name: Build APK Staging
        run: flutter build apk --flavor staging --dart-define=FLAVOR=staging --release

      - name: Build APK Production
        run: flutter build apk --flavor production --dart-define=FLAVOR=production --release

      - name: Build AAB Production
        run: flutter build appbundle --flavor production --dart-define=FLAVOR=production --release

      - name: Upload Staging APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-staging
          path: build/app/outputs/flutter-apk/*staging*.apk

      - name: Upload Production APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-production
          path: build/app/outputs/flutter-apk/*production*.apk

      - name: Upload Production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-bundle-production
          path: build/app/outputs/bundle/productionRelease/*.aab
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare build directories and configure Flutter
        run: |
          flutter config --no-enable-macos-desktop
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS Staging (unsigned)
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter build ios --flavor staging --dart-define=FLAVOR=staging --release --no-codesign

      - name: Package unsigned Staging IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r HaloAPU-Staging-iOS-unsigned.ipa Payload
          rm -rf Payload Runner.app

      - name: Build iOS Production (unsigned)
        run: |
          mkdir -p build/ios/SourcePackages build/macos/SourcePackages
          flutter build ios --flavor production --dart-define=FLAVOR=production --release --no-codesign

      - name: Package unsigned Production IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r HaloAPU-Production-iOS-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload iOS Staging IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-staging
          path: build/ios/iphoneos/HaloAPU-Staging-iOS-unsigned.ipa

      - name: Upload iOS Production IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-production
          path: build/ios/iphoneos/HaloAPU-Production-iOS-unsigned.ipa
